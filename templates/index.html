<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Security Scanner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <main class="page">
      <section class="card">
        <h1>Email Security Scanner</h1>
        <p class="subtitle">
          Detect fraud and prompt injection risks using a Naive Bayes classifier.
        </p>

        <label for="emailText">Email Content</label>
        <textarea
          id="emailText"
          placeholder="Paste the email body here..."
          rows="12"
        ></textarea>

        <button id="scanBtn" type="button">Scan Email</button>

        <section id="results" class="results hidden" aria-live="polite">
          <div class="badge-row">
            <span>Status</span>
            <span id="statusBadge" class="badge">-</span>
          </div>

          <div class="metric">
            <div class="metric-head">
              <span>Safety Probability</span>
              <strong id="safeValue">0%</strong>
            </div>
            <div class="bar"><div id="safeBar" class="fill fill-safe"></div></div>
          </div>

          <div class="metric">
            <div class="metric-head">
              <span>Fraud Probability</span>
              <strong id="fraudValue">0%</strong>
            </div>
            <div class="bar"><div id="fraudBar" class="fill fill-fraud"></div></div>
          </div>

          <div class="metric">
            <div class="metric-head">
              <span>Prompt Injection Probability</span>
              <strong id="injectionValue">0%</strong>
            </div>
            <div class="bar"><div id="injectionBar" class="fill fill-injection"></div></div>
          </div>

          <div class="type-grid" aria-label="Detected type summary">
            <div class="type-item">
              <span class="type-label">Fraud Type</span>
              <strong id="fraudType">None detected</strong>
            </div>
            <div class="type-item">
              <span class="type-label">Prompt Injection Type</span>
              <strong id="injectionType">None detected</strong>
            </div>
          </div>

          <p id="predictedLabel" class="prediction"></p>
        </section>

        <p id="errorText" class="error hidden"></p>
      </section>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
